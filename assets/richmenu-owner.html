<!doctype html>
<!-- Source for the owner's LINE Rich Menu image (2500 × 1686 px).
     Rendered to richmenu-owner.png by: npm run richmenu -- --render
     Tile order must match AREAS in scripts/richmenu.js. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 2500px; height: 1686px; overflow: hidden; }
  body {
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr);
    gap: 14px; background: #d9dee6; padding: 14px; box-sizing: border-box;
    font-family: -apple-system, "Helvetica Neue", "Thonburi", sans-serif;
  }
  .tile {
    border-radius: 36px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; text-align: center;
  }
  .icon { font-size: 260px; line-height: 1; margin-bottom: 36px; }
  .title { font-size: 118px; font-weight: 700; letter-spacing: 1px; }
  .sub { font-size: 62px; opacity: 0.92; margin-top: 16px; }
  .inbox { background: #2f6fde; }
  .email { background: #1f9d8a; }
  .calendar { background: #e0822a; }
  .facebook { background: #3b5998; }
  .modes { background: #7b4fd6; }
  .modes .title { font-size: 92px; white-space: nowrap; }
  .help { background: #5b6472; }
</style>
</head>
<body>
  <div class="tile inbox"><div class="icon">📬</div><div class="title">Inbox</div><div class="sub">อีเมลใหม่วันนี้</div></div>
  <div class="tile email"><div class="icon">✉️</div><div class="title">Email</div><div class="sub">ส่งอีเมล</div></div>
  <div class="tile calendar"><div class="icon">📅</div><div class="title">Calendar</div><div class="sub">ปฏิทิน</div></div>
  <div class="tile facebook"><div class="icon">📘</div><div class="title">Facebook</div><div class="sub">โพสต์ลงเพจ</div></div>
  <div class="tile modes"><div class="icon">💬</div><div class="title">Chat · Translate</div><div class="sub">คุย / แปลภาษา</div></div>
  <div class="tile help"><div class="icon">❓</div><div class="title">Help</div><div class="sub">วิธีใช้</div></div>
</body>
</html>
