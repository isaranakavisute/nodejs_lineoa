<!doctype html>
<!-- Source for the LINE OA profile icon (640 × 640 px). LINE shows it as a circle, so everything
     important stays inside the centre circle. Pick a design with #a, #b or #c in the URL. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>LINE OA icon</title>
<style>
  html, body { margin: 0; width: 640px; height: 640px; overflow: hidden; }
  body { font-family: -apple-system, "Helvetica Neue", sans-serif; }
  .icon { display: none; width: 640px; height: 640px; position: relative; align-items: center; justify-content: center; }
  .show { display: flex; }

  /* A: assistant speech bubble with a check mark */
  #a { background: linear-gradient(145deg, #2f6fde 0%, #1f9d8a 100%); }
  #a .bubble {
    width: 360px; height: 290px; background: #fff; border-radius: 90px; position: relative;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 18px 40px rgba(0,0,0,0.18);
  }
  #a .bubble::after {
    content: ''; position: absolute; bottom: -50px; left: 70px; border-width: 60px 0 0 60px;
    border-style: solid; border-color: #fff transparent transparent transparent;
  }
  #a .check { font-size: 190px; font-weight: 800; color: #1f9d8a; line-height: 1; margin-top: -10px; }

  /* B: calendar + mail + translate, the bot's three main jobs */
  #b { background: linear-gradient(145deg, #7b4fd6 0%, #2f6fde 100%); }
  #b .row { display: flex; gap: 26px; align-items: center; }
  #b .tile {
    width: 150px; height: 150px; border-radius: 40px; background: #fff; display: flex;
    align-items: center; justify-content: center; font-size: 96px; box-shadow: 0 12px 28px rgba(0,0,0,0.2);
  }
  #b .tile.big { width: 190px; height: 190px; border-radius: 50px; font-size: 128px; }

  /* C: monogram "IN" with a small calendar tick, personal and simple */
  #c { background: linear-gradient(145deg, #1d2b4f 0%, #2f6fde 100%); }
  #c .mono { font-size: 250px; font-weight: 800; color: #fff; letter-spacing: -8px; }
  #c .dot {
    position: absolute; right: 150px; bottom: 150px; width: 120px; height: 120px; border-radius: 50%;
    background: #22c55e; border: 12px solid #fff; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 70px; font-weight: 800;
  }
</style>
</head>
<body>
  <div class="icon" id="a"><div class="bubble"><div class="check">✓</div></div></div>
  <div class="icon" id="b"><div class="row"><div class="tile">✉️</div><div class="tile big">📅</div><div class="tile">🌐</div></div></div>
  <div class="icon" id="c"><div class="mono">IN</div><div class="dot">✓</div></div>
  <script>
    document.getElementById((location.hash || '#a').slice(1)).classList.add('show');
  </script>
</body>
</html>
