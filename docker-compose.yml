services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
    expose:
      - "3000"
    volumes:
      # News subscribers are saved here so they survive restarts and redeploys.
      - app_data:/app/data

  # Terminates HTTPS with an automatic Let's Encrypt certificate.
  # Requires DOMAIN in .env pointing (DNS A record) at this server, with ports 80 and 443 open.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  app_data:
  caddy_data:
  caddy_config:
